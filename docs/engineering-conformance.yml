      - obligation: Shared mainlines are protected and kept releasable
        status: deviation
        deviation: DEV-001
  ES-012:
    status: deviation
    obligations:
      - obligation: Applicable checks run in an authoritative clean environment before shared merge
        status: compliant
        evidence:
          - .github/workflows/ci.yml runs lock-file, format, build, test, secret and vulnerability checks on every pull request; codeql.yml runs static analysis.
      - obligation: Immediate material-risk checks block the merge event
        status: deviation
        deviation: DEV-001
  ES-013:
    status: compliant
    evidence:
      - Directory.Packages.props pins every NuGet version; the policy test Package_versions_are_only_set_centrally enforces it.
      - The policy test Every_project_has_a_committed_lock_file checks lock files against git ls-files; `make lockfiles-check` fails CI when restore changes or creates a lock file.
      - global.json pins the exact .NET SDK (rollForward disable) and the Aspire AppHost SDK; CI installs that SDK.
      - Local tools (Stryker, the Aspire CLI) are pinned in .config/dotnet-tools.json with rollForward false and restored by `make restore`; the policy test Aspire_cli_tool_sdk_and_packages_share_one_version keeps the Aspire CLI, SDK and packages on one version (ADR 0012).
      - CI tools are pinned (Actions by commit SHA, gitleaks by version and SHA-256 checksum).
      - npm dependencies are exact versions with a committed lock file, installed by `npm ci` with install scripts disabled; CI installs the exact Node version in .nvmrc, and release artifacts are built only by CI. package.json engines accepts the same major only (any 26.x), with engine-strict, so local builds may use another 26 patch by design (ADR 0007). Policy tests Npm_dependencies_are_exact_and_locked, Npm_never_runs_install_scripts_and_enforces_the_node_version and Node_engine_range_matches_the_ci_version.
  ES-014:
