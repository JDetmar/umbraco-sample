  ES-016:
    status: compliant
    evidence:
      - .github/dependabot.yml discovers updates weekly for NuGet, npm (frontend/ and e2e/), GitHub Actions and Docker base images.
      - "`make vuln` fails CI on any known-vulnerable NuGet package, including transitive ones; `make frontend-audit` fails on npm advisories of moderate or above unless the advisory is assessed with a ledger reference and an expiry (frontend/scripts/audit-policy.mjs, tested in frontend/test/audit-policy.test.mjs)."
      - CodeQL runs on every pull request and weekly (.github/workflows/codeql.yml).
      - Triage: a NuGet finding fails the build and is resolved by an upgrade before merge, since `make vuln` has no suppression path; an npm finding is either fixed or assessed with a ledger reference and an expiry. Dependabot pull requests are reviewed like any other change.
  ES-017:
    status: compliant
    evidence:
      - Every third-party action in .github/workflows is pinned to a full commit SHA.
      - Every workflow declares top-level `permissions` with read-only defaults; the policy tests reject unpinned actions, missing permissions and write-all or read-all.
      - Job-level write grants are allowlisted by a policy test (Write_permissions_are_granted_only_to_allowlisted_jobs): packages write only to the ci publish job, which runs only on main, checks out nothing and runs no third-party build code; security-events write only to the CodeQL job; id-token write only to the infra preview job and the ci deploy-dev job, for OIDC sign-in to Azure and Pulumi Cloud (no stored Azure or Pulumi secret); preview runs only on main or a manual run, deploy-dev only on main after publish (ADR 0013).
  ES-018:
    status: compliant
    evidence:
      - "tests/UmbracoSample.Domain.Tests/ArchitectureTests.cs (NetArchTest) fails the fast gate if UmbracoSample.Domain depends on any of: Umbraco, ASP.NET Core, Microsoft.Extensions, EF Core, Microsoft.Data, System.Data, System.Net or System.IO. A committed negative test shows that the same rule rejects a probe type using File and HttpClient. A second test fails if the Domain project file gains any package, project, assembly or framework reference."
  ES-019:
