# Engineering conformance ledger.
#
# Records evidence and open deviations against the engineering standard (ES-038); it never changes a requirement.
# - Every clause starts unknown. A clause left out of `clauses` is unknown, and unknown is never conformance.
# - Mark a clause compliant only with evidence: a check that runs, a test, a document, or a recorded review.
# - Record a deviation as soon as it is known, with an owner and a target disposition.
# - Agents never approve an exception, accepted risk or emergency: `approver` and `approval_ref` are filled by the owner.

standard_version: "6.2"
repository: umbraco-sample
owner: repository-owner
updated: 2026-11-24

clauses:
  ES-011:
    status: deviation
    obligations:
      # "Every release corresponds to a green, identifiable mainline revision" stays unknown until the first release exists.
      - obligation: Shared mainlines are protected and kept releasable
        status: deviation
        deviation: DEV-001
  ES-012:
    status: deviation
    obligations:
      - obligation: Applicable checks run in an authoritative clean environment before shared merge
        status: compliant
        evidence:
          - .github/workflows/ci.yml runs lock-file, format, build, test, secret and vulnerability checks on every pull request; codeql.yml runs static analysis.
      - obligation: Immediate material-risk checks block the merge event
        status: deviation
        deviation: DEV-001
  ES-013:
    status: compliant
    evidence:
      - Directory.Packages.props pins every NuGet version; the policy test Package_versions_are_only_set_centrally enforces it.
      - The policy test Every_project_has_a_committed_lock_file checks lock files against git ls-files; `make lockfiles-check` fails CI when restore changes or creates a lock file.
      - global.json pins the exact .NET SDK (rollForward disable) and the Aspire AppHost SDK; CI installs that SDK.
      - CI tools are pinned (Actions by commit SHA, gitleaks by version and SHA-256 checksum).
  ES-015:
    status: compliant
    evidence:
      - docs/dependencies.md records health, footprint, licence, security and exit cost for each dependency; owner approved on 2026-11-24.
  ES-017:
    status: compliant
    evidence:
      - Every third-party action in .github/workflows is pinned to a full commit SHA.
      - Every workflow declares top-level `permissions` with read-only defaults; the policy tests reject unpinned actions, missing permissions and write-all or read-all.
  ES-019:
    status: compliant
    evidence:
      - docs/adr/0001 to 0006 record context, alternatives, decision and consequences.
  ES-024:
    status: deviation
    obligations:
      - obligation: Secrets stay out of committed source, configuration, logs and CI definitions
        status: compliant
        evidence:
          - The local admin password is an Aspire secret parameter supplied through user secrets.
      - obligation: Secret scanning gates shared merge
        status: deviation
        deviation: DEV-001
  ES-030:
    status: compliant
    evidence:
      - ServiceDefaults exports OpenTelemetry traces and metrics over OTLP (vendor-neutral); health-probe requests are filtered out of traces.
      - Umbraco's Serilog pipeline replaces the OpenTelemetry log provider, so structured logs go to stdout as compact JSON (appsettings.json) for the container platform to collect, rather than over OTLP.
      - /health/live, /health/ready (includes Umbraco runtime level) and /health/schema (uSync schema drift) are mapped in every environment; the integration tests assert all three, and unit tests cover every drift outcome, including the vacuous no-handlers case.
      - scripts/smoke.sh is the post-deployment check; CI runs it against the built image with SQL Server on every pull request.
  ES-049:
    status: unknown
    obligations:
      - obligation: Releases identify source revision, builder/toolchain, artifact digest and deployed version
        status: unknown
        evidence:
          - The image carries the source revision as an OCI label and as the OpenTelemetry service.version; CI builds it from pinned base-image digests and records the image ID and an SPDX SBOM per run.
          - No release or registry push exists yet; publishing to a registry and promotion by digest arrive with the deployment pipeline, which needs owner approval.
  ES-052:
    status: compliant
    evidence:
      - Makefile documents bootstrap, build, test, validate and run; CI calls the same targets.
  ES-053:
    status: compliant
    evidence:
      - CLAUDE.md (and AGENTS.md) are version-controlled and list commands, policies and the agent envelope.
      - The Aspire AppHost provides an isolated local environment with a containerised SQL Server.
  ES-054:
    status: deviation
    obligations:
      - obligation: Action-capable agents have an explicitly delegated scope covering actions, resources, blast radius, budgets and approval thresholds
        status: compliant
        evidence:
          - CLAUDE.md "Agent delegation envelope" records the delegated actions, exclusions, blast radius, time budget and stop conditions, delegated by the owner on 2026-11-24.
      - obligation: Authorization is enforced outside model-generated text
        status: deviation
        deviation: DEV-001
  ES-061:
    status: not_applicable
    reason: The repository ships no software that runs on physical devices.

deviations:
  - id: DEV-001
    kind: gap
    clauses: [ES-011, ES-012, ES-024, ES-054]
    obligations:
      - Shared mainlines are protected and kept releasable
      - Immediate material-risk checks block the merge event
      - Secret scanning gates shared merge
      - Authorization is enforced outside model-generated text
    summary: Branch protection with required status checks is not yet enabled on main, so neither CI failures nor the agent envelope are technically enforced at merge.
    consequence: A change could reach main without passing the authoritative gate, including the secret scan, and an agent's merge authority rests on its own adherence to CLAUDE.md.
    compensating_controls: None technical. Procedurally, every merge so far has a green CI run and an independent reviewer context recorded in the pull request, and the owner can review and revert any merge from the pull request history.
    owner: repository-owner
    opened: 2026-11-24
    disposition: Owner enables branch protection on main requiring the CI checks and a linear history; agents cannot change repository settings.

  - id: DEV-002
    kind: accepted_risk
    clauses: [ES-027]
    obligations:
      - Raw production data MUST NOT enter development, test, CI, demos, or unmanaged analysis
    summary: "PROPOSED, awaiting owner approval: published, public page content may be copied from production to staging to test against real pages."
    consequence: Staging holds a copy of production page content; a mistake in scrubbing could also copy members, users or form data.
    compensating_controls: Only published content nodes and media are copied; member, user, form and audit tables are excluded and verified empty after copy; dev and CI keep synthetic seed content only.
    owner: repository-owner
    opened: 2026-11-24
    approver: null
    approval_ref: null
    threat_model_ref: docs/plan.md, "Where CMS practice departs from the standard", item 1 (to be replaced by a threat model before the copy job exists)
    review_triggers:
      - Any member, user or personal data stored in the CMS.
      - A change to the copy job's scope.
      - Staging becoming reachable without authentication.

  - id: DEV-003
    kind: accepted_risk
    clauses: [ES-014]
    obligations:
      - Production schema changes use backward-compatible expand/contract and forward-only corrective migrations
    summary: "PROPOSED, awaiting owner approval: Umbraco version upgrades run Umbraco's own database migrations, which are not expand/contract and cannot be contained by shifting traffic to the previous revision."
    consequence: A failed upgrade may need a database restore rather than a traffic shift, with downtime and possible loss of content edits made since the backup.
    compensating_controls: Production runs with UpgradeUnattended false, so migrations only run in a deliberate upgrade release; upgrades ship as their own release; a fresh backup is taken immediately before; the upgrade is rehearsed in staging with a restore test; a content freeze covers the upgrade window. Expand/contract for our own content types is not yet enforced (DEV-005).
    owner: repository-owner
    opened: 2026-11-24
    approver: null
    approval_ref: null
    threat_model_ref: docs/adr/0001-umbraco-17-lts.md
    review_triggers:
      - A new Umbraco major version.
      - Umbraco adding rollback-safe migrations.
      - A change to the backup or restore procedure.

  - id: DEV-004
    kind: gap
    clauses: [ES-024, ES-026]
    obligations:
      - Rate, payload and execution limits for public or expensive operations
      - Secrets remain outside committed source and configuration
    summary: Image-processing URLs are not signed yet because no per-environment HMAC key is configured, so anyone can request arbitrary resizes.
    consequence: An attacker could drive expensive image processing and fill the media cache. A key the Umbraco template generated was briefly pushed to a feature branch (commit efedc5b, still reachable by SHA on GitHub); that value is treated as exposed and is never used.
    compensating_controls: No environment is deployed yet; the site has no media items.
    owner: repository-owner
    opened: 2026-11-24
    disposition: Before the first deployment, Pulumi generates a per-environment key into Key Vault and the site reads Umbraco:CMS:Imaging:HMACSecretKey from it; Front Door rate limiting covers /media.

  - id: DEV-005
    kind: gap
    clauses: [ES-014]
    obligations:
      - Production schema changes use backward-compatible expand/contract and forward-only corrective migrations
    summary: Production imports uSync settings at every startup, and nothing yet stops a single change from removing a document-type property (and its content) in the same release that stops using it.
    consequence: A rollout that removes a property cannot be contained by shifting traffic back to the previous revision, because the data is already gone.
    compensating_controls: No environment is deployed yet; /health/schema reports drift; every change is reviewed.
    owner: repository-owner
    opened: 2026-11-24
    disposition: Before the first deployment, add an ADR for schema changes (expand in one release, contract in a later one) and a repository test that fails when a uSync diff removes a property while views or view models still change in the same pull request, or decide with the owner to disable deletes during startup import.
