      - obligation: Untrusted or semi-trusted input is validated or encoded at the boundary where it is rendered
        status: deviation
        deviation: DEV-007
      - obligation: Outputs are encoded appropriately at trust boundaries
        status: deviation
        deviation: DEV-012
  ES-027:
    status: compliant
    evidence:
      - Development, CI and the dev environment use only the synthetic seed content committed under src/UmbracoSample.Web/uSync/v17/Content; no production environment or production data exists. DEV-002 proposes a limited copy of public page content to a future staging environment and is parked while dev is the only environment.
  ES-030:
    status: deviation
    obligations:
      - obligation: Services emit telemetry and health signals and have a post-deployment verification
        status: compliant
        evidence:
          - ServiceDefaults exports OpenTelemetry traces and metrics over OTLP (vendor-neutral); health-probe requests are filtered out of traces.
          - When APPLICATIONINSIGHTS_CONNECTION_STRING is set (Azure), ServiceDefaults also exports traces and metrics to Application Insights with the Azure Monitor exporter, authenticated by the workload's managed identity (WorkloadIdentity); OTLP is unchanged for local runs.
          - Umbraco's Serilog pipeline replaces the OpenTelemetry log provider, so structured logs go to stdout as compact JSON (appsettings.json) for the container platform to collect, rather than over OTLP.
          - /health/live, /health/ready (includes Umbraco runtime level) and /health/schema (uSync schema drift) are mapped in every environment; the integration tests assert all three, and unit tests cover every drift outcome, including the vacuous no-handlers case.
          - scripts/smoke.sh is the post-deployment check; CI runs it against the built image with SQL Server on every pull request, and the deploy-dev job (ADR 0013) runs it against dev after every deploy. A failed smoke test fails the run but does not roll back; recovery is a fix forward or a revert (docs/infra-setup.md, section 4).
      - obligation: Production paths are diagnosable after deployment
        status: deviation
        deviation: DEV-011
      - obligation: Services scale and recover without losing user sessions
        status: deviation
        deviation: DEV-015
  ES-035:
    status: deviation
