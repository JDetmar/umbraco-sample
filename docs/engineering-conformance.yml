      - obligation: Secret scanning gates shared merge
        status: deviation
        deviation: DEV-001
  ES-025:
    status: deviation
    obligations:
      - obligation: Sensitive data is encrypted in transit
        status: deviation
        deviation: DEV-010
      - obligation: Sensitive data is encrypted in transit
        status: deviation
        deviation: DEV-013
      - obligation: Sensitive data is excluded from public CI logs
        status: deviation
        deviation: DEV-020
      - obligation: Sensitive data is excluded from public CI logs
        status: compliant
        evidence:
          - Workflows read the Azure tenant and subscription IDs only from secrets, which GitHub masks everywhere in a log, kept so by the policy test Azure_tenant_and_subscription_ids_reach_workflows_only_as_secrets.
          - Pulumi steps in CI run without a property diff and post nothing to comments or summaries (ADR 0014, proposed), kept so by the policy test Pulumi_runs_in_ci_never_print_a_property_diff.
          - The one leaked log (run 45677402486, a sign-in name from Azure systemData) was deleted by the owner on 2026-11-25; copies made before then cannot be recalled. On 2026-11-25 at 19:10 UTC the logs of every completed run (404 of 409; the rest were in progress) were searched for email addresses, JWTs, Pulumi and GitHub tokens, storage keys, passwords, connection strings, instrumentation keys and /32 addresses; none were found beyond public noreply addresses and the placeholder admin@example.com. Later runs are covered by the policy test, not the scan.
  ES-026:
