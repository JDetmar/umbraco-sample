deviations:
  - id: DEV-001
    kind: accepted_risk
    clauses: [ES-011, ES-012, ES-024, ES-054]
    obligations:
      - Shared mainlines are protected and kept releasable
      - Immediate material-risk checks block the merge event
      - Secret scanning gates shared merge
      - Authorization is enforced outside model-generated text
    summary: "Accepted by the owner for a single-maintainer repository on 2026-11-25 (ADR 0015). Since 2026-11-24 two repository rulesets protect main. Ruleset main-1 (id 28000620) blocks deletion and force-push for everyone, with no bypass. Ruleset main-2 (id 28000621) requires six status checks bound to GitHub Actions (integration_id 15368): validate, integration, image, e2e, analyze (csharp) and analyze (actions), on an up-to-date branch. Repository admins can bypass main-2 at any time, and the agent acts as the owner's account, which has admin rights (GET /user returns the owner's login; repository permissions show admin: true). No rule requires a pull request or an approving review."
    consequence: Non-admins cannot get a change into main without the authoritative gate, including the secret scan, and nobody can rewrite or delete main. An admin, or the agent acting as one, could still merge past a red check or push a commit straight to main without a pull request. The agent's merge authority, including the independent-review and PR-body conditions in CLAUDE.md, still rests on its own adherence to CLAUDE.md.
    compensating_controls: main-1 applies to everyone, so history on main cannot be rewritten or deleted. main-2 gates every non-admin change. Procedurally, every agent merge so far has had a green CI run and an independent reviewer recorded in the pull request.
    owner: repository-owner
    opened: 2026-11-24
    approver: repository-owner
    approval_ref: Owner approval in the project thread on 2026-11-25 ("I approve the admin bypass item"), recorded in pull request 37
    threat_model_ref: docs/adr/ADR-0015-admin-bypass-for-a-single-maintainer.md
    review_triggers:
      - A second person gets write access to the repository.
      - The agent gets its own identity, or any identity other than the owner's can merge.
      - An agent merges past a red required check or pushes to main without a pull request.
      - A staging or prod environment is deployed from main.
      - A CI job is renamed (the matching required check in main-2 must be renamed in the same change, or every pull request blocks).

  - id: DEV-002
    kind: accepted_risk
    clauses: [ES-027]
    obligations:
      - Raw production data MUST NOT enter development, test, CI, demos, or unmanaged analysis
    summary: "PROPOSED, parked while dev is the only environment (owner, 2026-11-25): published, public page content may be copied from production to staging to test against real pages. Revisit when staging is planned."
    consequence: Staging holds a copy of production page content; a mistake in scrubbing could also copy members, users or form data.
    compensating_controls: Only published content nodes and media are copied; member, user, form and audit tables are excluded and verified empty after copy; dev and CI keep synthetic seed content only.
    owner: repository-owner
    opened: 2026-11-24
    approver: null
    approval_ref: null
    threat_model_ref: docs/plan.md, "Where CMS practice departs from the standard", item 1 (to be replaced by a threat model before the copy job exists)
    review_triggers:
      - Any member, user or personal data stored in the CMS.
      - A change to the copy job's scope.
      - Staging becoming reachable without authentication.

  - id: DEV-003
    kind: accepted_risk
    clauses: [ES-014]
    obligations:
      - Production schema changes use backward-compatible expand/contract and forward-only corrective migrations
    summary: "PROPOSED, awaiting owner approval: Umbraco version upgrades run Umbraco's own database migrations, which are not expand/contract and cannot be contained by shifting traffic to the previous revision."
    consequence: A failed upgrade may need a database restore rather than a traffic shift, with downtime and possible loss of content edits made since the backup.
    compensating_controls: Production runs with UpgradeUnattended false, so migrations only run in a deliberate upgrade release; upgrades ship as their own release; a fresh backup is taken immediately before; the upgrade is rehearsed in staging with a restore test; a content freeze covers the upgrade window. Expand/contract for our own content types is not yet enforced (DEV-005).
    owner: repository-owner
    opened: 2026-11-24
    approver: null
    approval_ref: null
    threat_model_ref: docs/adr/ADR-0001-umbraco-17-lts.md
    review_triggers:
      - A new Umbraco major version.
      - Umbraco adding rollback-safe migrations.
      - A change to the backup or restore procedure.

  - id: DEV-004
    kind: gap
    clauses: [ES-024, ES-026]
    obligations:
      - Rate, payload and execution limits for public or expensive operations
      - Secrets remain outside committed source and configuration
    summary: Image-processing URLs are not signed yet because no per-environment HMAC key is configured, so anyone can request arbitrary resizes.
    consequence: An attacker could drive expensive image processing and fill the media cache. A key the Umbraco template generated was briefly pushed to a feature branch (commit efedc5b, still reachable by SHA on GitHub); that value is treated as exposed and is never used.
    compensating_controls: Only dev is deployed; it holds synthetic content and no media items.
    owner: repository-owner
    opened: 2026-11-24
    disposition: "Declared in infra (ADR 0010): the owner sets a per-environment imagingHmacKey Pulumi secret, Pulumi writes it to Key Vault, and the container reads Umbraco:CMS:Imaging:HMACSecretKey as a Key Vault reference (mock test Container_secrets_are_key_vault_references_read_with_the_site_identity). Closes when a deployed environment is verified to reject unsigned resize URLs; Front Door rate limiting covers /media."

  - id: DEV-005
    kind: gap
    clauses: [ES-014]
    obligations:
      - Destructive contraction occurs in a later deployment, after consumers have stopped relying on the old shape
    summary: Production imports uSync settings at every startup, and nothing yet stops a single change from removing a document-type property (and its content) in the same release that stops using it.
    consequence: A rollout that removes a property cannot be contained by shifting traffic back to the previous revision, because the data is already gone.
    compensating_controls: Only dev is deployed, with synthetic content that the seed recreates; /health/schema reports drift; every change is reviewed.
    owner: repository-owner
    opened: 2026-11-24
    disposition: "Was due before the first deployment; dev has deployed since 2026-11-25 and holds only synthetic content, so the target is now before any staging or prod environment. Add an ADR for schema changes (expand in one release, contract in a later one) and a repository test that fails when a uSync diff removes a property while views or view models still change in the same pull request, or decide with the owner to disable deletes during startup import."

  - id: DEV-007
    kind: gap
    clauses: [ES-026, ES-035]
    obligations:
      - Untrusted or semi-trusted input is validated or encoded at the boundary where it is rendered
      - Content meets the accessibility baseline
    summary: Rich-text markup is rendered as stored. The restricted editor offers no images, source editing, inline styles, or headings other than h2 and h3, but markup saved through the Management API or pasted in is not sanitized server-side, so it can carry any tag, attribute or link scheme, and any heading level.
    consequence: A back-office user (or a compromised back-office account) could store script, unsafe links or a broken heading outline that every visitor receives.
    compensating_controls: "Only authenticated back-office users can save content; links outside rich text go through the LinkModel scheme allowlist; text fields are HTML-encoded (integration test Text_fields_are_html_encoded); site pages, including previews, carry a content security policy with no inline script, so injected inline script and event handlers do not run in current browsers (ADR 0008). The policy trusts this origin (script-src 'self'), so media uploads are an allowlist of image and PDF extensions, with script, markup, SVG and stylesheet extensions also denied (UploadPolicyTests). Residual: a script element pointing at a script file already on this origin still runs, and back-office users with Settings access can create files under /scripts; both need a back-office account and are closed by sanitizing rich text."
    owner: repository-owner
    opened: 2026-11-24
    disposition: "Proposed for owner approval: register a server-side IHtmlSanitizer built on HtmlSanitizer (Ganss.Xss, MIT) with a tag, attribute and URL-scheme allowlist that also maps headings to h2/h3. Added to docs/dependencies.md as Proposed. Reviewed with the Phase 4 threat model (ES-023)."

  - id: DEV-008
    kind: gap
    clauses: [ES-036]
    obligations:
      - Automated accessibility checks run in the authoritative gate
      - Periodic real keyboard and screen-reader assessment (SHOULD)
    summary: The e2e job runs axe on every seeded page and has been a required check on main since 2026-11-24 (ruleset main-2), but admins can bypass that requirement (DEV-001). No periodic manual keyboard and screen-reader assessment is scheduled.
    consequence: An admin, or the agent acting as one, could merge with an accessibility failure. Automated rules catch roughly a third to a half of real accessibility problems; the rest need people.
    compensating_controls: The delegation envelope forbids agents merging with a failing check; axe, keyboard journeys and contrast tests run on every pull request.
    owner: repository-owner
    opened: 2026-11-24
    disposition: The gate part rests on DEV-001 (an accepted risk for a single maintainer) and reopens with its review triggers. Schedule a manual keyboard and screen-reader pass (for example NVDA and VoiceOver on the fixture pages) before the first public release, and record it here.

  - id: DEV-010
    kind: gap
    clauses: [ES-025]
    obligations:
      - Sensitive data is encrypted in transit
    summary: The site does not send Strict-Transport-Security. The container sees plain HTTP behind the edge, so HSTS is planned at Front Door (ADR 0008).
    consequence: Until the edge sends it, a visitor's first request over http can be downgraded. The infrastructure (ADR 0010) makes a dev stack deployable without the edge, so a deployed dev site, including its back office, would be public over HTTPS without HSTS or a WAF.
    compensating_controls: Prod cannot deploy without the edge (SiteSettings.Validate). Dev uses synthetic content only, the lead form stays off, the Container Apps ingress refuses plain HTTP, and Umbraco installs unattended so the installer is never public. The owner accepted this for dev only on 2026-11-24 (threat model 0002, R1); it does not extend to prod.
    owner: repository-owner
    opened: 2026-11-24
    approver: repository-owner
    approval_ref: Owner accepted the dev exposure in the project thread on 2026-11-24 (threat model 0002, R1), recorded in pull request 15; the gap stays open for prod
    threat_model_ref: docs/threat-models/0002-azure-environment.md
    disposition: "In Phase 5, Front Door sends HSTS (max-age at least one year, includeSubDomains once every subdomain is HTTPS) and redirects http to https, and the post-deployment smoke test asserts both. Alternative recorded in ADR 0008: ForwardedHeaders plus UseHsts in the app."

  - id: DEV-011
    kind: gap
    clauses: [ES-030]
    obligations:
      - Production paths are diagnosable after deployment
    summary: The content security policy has no reporting endpoint, so violations in production (a blocked tag, a broken page) are invisible.
    consequence: A policy that blocks something editors added, or an attack it stopped, goes unnoticed until someone reports a broken page.
    compensating_controls: Integration tests fail on any resource or inline code the policy would block on the seeded pages.
    owner: repository-owner
    opened: 2026-11-24
    disposition: With the Application Insights work in Phase 5, add a Reporting-Endpoints header and report-to directive that send violation reports to a small endpoint that logs them (bounded and rate limited, ES-026), with an alert on volume.

  - id: DEV-012
    kind: gap
    clauses: [ES-026]
    obligations:
      - Outputs are encoded appropriately at trust boundaries
    summary: "Two surfaces sit outside the strict site policy: the back office (/umbraco) gets only a minimal policy (object-src, base-uri, frame-ancestors), because Umbraco owns its scripts; and Umbraco's built-in 404 page uses an inline style block that the site policy blocks, so it renders unstyled."
    consequence: Script injection in the back office is constrained only by Umbraco's own defences; the 404 page looks broken.
    compensating_controls: The back office requires authentication and gets nosniff, framing and referrer headers; Umbraco 17 emits nonces for its own scripts.
    owner: repository-owner
    opened: 2026-11-24
    disposition: Add a custom 404 page (document type, template and the Error404Collection setting) styled from the site stylesheet. This was due before the first deployment; dev has deployed since 2026-11-25, so the target is now before any staging or prod environment. Revisit a fuller back-office policy built on Umbraco's ICspNonceService when Umbraco documents one as supported. Extend the test extractor to SVG image/use href and a ping, check preconnect against the union of directives before the first CDN is allowlisted, and add an integration test that a .js upload is refused through the Management API.

  - id: DEV-013
    kind: gap
    clauses: [ES-025]
    obligations:
      - Sensitive data is encrypted in transit
    summary: "Planned topology: Front Door to the Container Apps ingress is HTTPS, but inside the Container Apps environment the ingress forwards plain HTTP to the site container. Lead form submissions (personal data, threat model 0001) cross that hop unencrypted."
    consequence: Anything able to observe traffic inside the Container Apps environment's network could read submissions. Only dev is deployed, with the lead form off, so no submission crosses the hop today.
    compensating_controls: The hop stays inside the managed environment's private network; forms are not enabled on a public environment before Phase 5 (threat model 0001, R2).
    owner: repository-owner
    opened: 2026-11-24
    disposition: "Fix declared in infra (ADR 0010): the Container Apps environment enables peer-to-peer encryption, so the ingress-to-container hop is TLS, at no extra charge (mock test The_container_apps_environment_runs_in_the_apps_subnet). Closes when a deployed environment is verified with it enabled."

  - id: DEV-014
    kind: gap
    clauses: [ES-049, ES-050]
    obligations:
      - Released artifacts are traceable to their SBOM (SHOULD)
      - Released artifacts are signed or carry build provenance (SHOULD)
    summary: The image published to GHCR is neither signed nor attested, and its SBOM is a CI run artifact linked from the run summary rather than attached to the registry digest.
    consequence: A consumer holding only a digest cannot verify who built it or find its SBOM once run artifacts expire (90 days by default).
    compensating_controls: Images are pinned by digest everywhere they are used; only the main branch, behind required CI, publishes; the run summary records digest, source revision and SBOM link together.
    owner: repository-owner
    opened: 2026-11-24
    disposition: Before the first production deployment, add build provenance and an SBOM attestation bound to the digest (for example actions/attest-build-provenance and actions/attest-sbom), which needs owner approval as new dependencies.

  - id: DEV-015
    kind: accepted_risk
    clauses: [ES-030, ES-047]
    obligations:
      - Services scale and recover without losing user sessions
    summary: Accepted by the owner for dev only (2026-11-24). The site runs as a single replica. Umbraco has no shared data-protection key ring and no explicit server roles, so a second replica would break back-office sign-in and antiforgery tokens, and both replicas would run scheduled publishing.
    consequence: No horizontal scaling; a replica restart signs editors out and drops in-flight requests. A replica stuck in Umbraco's BootFailed state stays alive but unready until restarted.
    compensating_controls: SiteSettings refuses maxReplicas above 1; multiple revisions allow rollback; a startup probe gives a resuming database five minutes.
    owner: repository-owner
    opened: 2026-11-24
    approver: repository-owner
    approval_ref: Owner decision in the project thread on 2026-11-24 (threat model 0002, R3), recorded in pull request 15
    threat_model_ref: docs/threat-models/0002-azure-environment.md
    review_triggers:
      - Any stack other than dev, or prod traffic.
      - Raising maxReplicas above 1.
    disposition: Before prod traffic, persist the data-protection key ring to Blob storage protected by Key Vault (managed identity), set SchedulingPublisher and Subscriber server roles, make liveness fail when Umbraco's runtime level is BootFailed, then lift the replica limit.

  - id: DEV-016
    kind: gap
    clauses: [ES-024]
    obligations:
      - Long-lived credentials have a documented lifetime (MUST) and are short-lived where possible (SHOULD)
    summary: "Was: CI previews used a stored Pulumi access token that could decrypt stack secrets. Now: the preview gets a short-lived token by OIDC exchange (pulumi/auth-actions); this entry closes once a preview has run that way."
    consequence: A leaked token exposes the Umbraco admin password and imaging key of every stack it can read, and can change stack state.
    compensating_controls: The token lives only in the infra-preview environment (main only, owner review); preview runs only on main or a manual run; the token has a 90-day expiry and a rotation reminder (docs/infra-setup.md).
    owner: repository-owner
    opened: 2026-11-24
    disposition: "Fix in place: the owner approved pulumi/auth-actions on 2026-11-24 (threat model 0002, R2), and the infra preview job now exchanges its GitHub OIDC token for a short-lived Pulumi token; no PULUMI_ACCESS_TOKEN is stored. Closes when the first preview has run this way."

  - id: DEV-017
    kind: accepted_risk
    clauses: [ES-024, ES-040, ES-054]
    obligations:
      - Identities have the least privilege their job needs
    summary: Accepted by the owner for dev, with conditions (2026-11-24). The deploy-dev identity (ADR 0013) is standing and privileged; Contributor on the subscription, Role Based Access Control Administrator limited to three roles, SQL administrator group membership, and a short-lived Pulumi token (personal, acting as the owner, on an individual Pulumi account). These rights reach any stack in the same subscription and Pulumi organization, not only dev, and during up it opens a SQL firewall rule for a shared GitHub-hosted runner's IP.
    consequence: A merged malicious or broken change could change or read resources and stack secrets beyond dev, or reach SQL from the runner's IP while the rule is open.
    compensating_controls: Federated only to this repository's dev environment, which runs only on main; review before merge (ES-028, not yet enforced for admins, DEV-001); CI gates before publish; post-deploy smoke test; dev holds only synthetic content; the firewall rule has one fixed name and is removed on exit; CD deploys only from the head of main after every gate, and only since the owner amended the delegation envelope (pull request 34) and set CD_DEV_ENABLED on 2026-11-25.
    owner: repository-owner
    opened: 2026-11-24
    approver: repository-owner
    approval_ref: Owner decision in the project thread on 2026-11-24 (threat model 0002, R4, "Accept with conditions"), recorded in pull request 30
    threat_model_ref: docs/threat-models/0002-azure-environment.md
    review_triggers:
      - Before any prod stack is created in the same subscription or Pulumi organization.
      - Any change to the deploy identity's roles or federated credentials.
    disposition: "Conditions of the acceptance, each a follow-up: (a) prod lives in a separate subscription and Pulumi project, or is never created with these credentials in reach; (b) a SQL administrator group for dev only; (c) Contributor narrowed to the resource group once a bootstrap stack creates it; (d) a team Pulumi token limited to the dev stack if the plan allows; (e) the database user step moves into the VNet, so no firewall rule is opened for a runner's IP."

  - id: DEV-018
    kind: gap
    clauses: [ES-001, ES-006]
    obligations:
      - Tests have a meaningful failure oracle for the behaviour they guard
    summary: The database user tool's T-SQL batch is checked only by text assertions in unit tests, not parsed by SQL Server in CI. A syntax error in it (EXEC with a function call) passed every test and first failed in the dev deploy on 2026-11-25.
    consequence: A later edit to the batch that breaks its syntax is caught only by the next dev deploy, which then fails at the database user step and leaves the app on its previous revision.
    compensating_controls: Unit tests forbid the known-bad EXEC form and assert the statement shape; the batch runs in one transaction, so a failure changes nothing; CD deploys dev on every merge, so the failure is seen within one run; dev holds only synthetic content.
    owner: repository-owner
    opened: 2026-11-25
    disposition: Add an integration test that sends the batch to the Aspire SQL Server container with SET PARSEONLY ON (TYPE = E users themselves exist only in Azure SQL, so execution stays covered by the dev deploy). Not done in the fix PR to keep the production fix small.
  - id: DEV-020
    kind: gap
    clauses: [ES-025]
    obligations:
      - Sensitive data is excluded from public CI logs
    summary: Before the IDs moved to secrets, the deploy-dev job printed the Azure tenant and subscription IDs in plain text (azure/login input and pulumi/actions env headers). Those logs are public, and a tenant ID resolves to the tenant's display name and default domain, which identify more than this repository should.
    consequence: Anyone reading the logs of the earlier deploy-dev runs on main (45553973503, 45671920271, 45675530873, 45677402486, 45681230448, 45682355271, 45683391197, and any later run before this change merged) can read both IDs. Neither ID can be changed.
    compensating_controls: The IDs are not credentials; sign-in needs OIDC federation limited to this repository's environments. New runs mask both values. Run 45677402486's logs are already deleted (for a different leak).
    owner: repository-owner
    opened: 2026-11-25
    disposition: The owner decides whether to delete the logs of the listed runs (permanent; the runs stay listed). Close this gap once they are deleted; otherwise the owner records the remaining exposure as an accepted risk.
