# Engineering conformance ledger.
#
# Records evidence and open deviations against the engineering standard (ES-038); it never changes a requirement.
# - Every clause starts unknown. A clause left out of `clauses` is unknown, and unknown is never conformance.
# - Mark a clause compliant only with evidence: a check that runs, a test, a document, or a recorded review.
# - Record a deviation as soon as it is known, with an owner and a target disposition.
# - Agents never approve an exception, accepted risk or emergency: `approver` and `approval_ref` are filled by the owner.

standard_version: "6.2"
repository: umbraco-sample
owner: repository-owner
updated: 2026-11-25

clauses:
  ES-001:
    status: deviation
    obligations:
      - obligation: Tests have a meaningful failure oracle for the behaviour they guard
        status: deviation
        deviation: DEV-018
  ES-002:
    status: compliant
    obligations:
      - obligation: Invariant-rich pure logic receives property-based testing (SHOULD)
        status: compliant
        evidence:
          - CsCheck properties over the redirect parser (tests/UmbracoSample.Domain.Tests/Redirects). Parsing never throws (5,000 hostile inputs per run). Normalisation is idempotent and ignores case and trailing slashes. Every valid map finds every source (2,000 maps per run). Every parsed map is flat, including targets that reuse a source with different case, slash, query, fragment or percent-encoding.
      - obligation: Critical domain logic receives mutation testing (SHOULD)
        status: compliant
        evidence:
          - Stryker.NET (`make mutation`, tests/UmbracoSample.Domain.Tests/stryker-config.json) runs weekly in .github/workflows/mutation.yml and fails below a 75% score. A local run on 2026-11-24 scored 89.50% (RedirectMap 88.7%, RedirectTarget 90.7%, SitePath 89.4%). The duplicate, self-redirect and chain checks are written as a plain method so Stryker can mutate them (as an iterator they were all excluded as compile errors); 16 mutants still fail to compile and are not counted. Survivors were reviewed: the empty-target, external-target whitespace and query-normalisation gaps found in review now have tests; the rest are error-message text and equivalent mutants. Stryker's Microsoft Testing Platform runner is marked preview by Stryker, so a falling score is checked by hand before it is trusted. GitHub notifies scheduled-workflow failures to the user who last changed the schedule; the owner confirms after the first run that this is them.
  ES-006:
    status: deviation
    obligations:
      - obligation: Tests have a meaningful failure oracle for the behaviour they guard
        status: deviation
        deviation: DEV-018
  ES-007:
    status: compliant
    evidence:
      - The redirect map is an owned parser of hand-edited input. On every pull request, CsCheck generates thousands of hostile inputs per property. These include separators, dot segments, percent-encodings, non-ASCII, control characters, CSV noise, and chains and loops in many spellings. This is generator-based fuzzing, not coverage-guided fuzzing.
      - Retained regression cases live in tests/UmbracoSample.Domain.Tests/Redirects/corpus (valid-*.csv must parse, invalid-*.csv must be rejected) and run with the fast tests. The corpus README.md documents how to capture a failing CsCheck seed as a case.
  ES-011:
    status: deviation
    obligations:
