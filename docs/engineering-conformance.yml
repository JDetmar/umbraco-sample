          - Keyboard journeys (skip link, token focus outline) and heading, alt-text and contrast rules are tested (e2e/tests/journeys.spec.mjs, ComponentFixtureTests, frontend/test/tokens.test.mjs).
      - obligation: Periodic real keyboard and screen-reader assessment (SHOULD)
        status: deviation
        deviation: DEV-008
  ES-037:
    status: compliant
    evidence:
      - .github/PULL_REQUEST_TEMPLATE.md carries the definition of done; main requires the six CI checks for non-admins (ruleset main-2; the admin bypass is accepted risk DEV-001); agent pull requests record an independent review in the pull request, by practice rather than by a check.
  ES-049:
    status: unknown
    obligations:
      - obligation: Releases identify source revision, builder/toolchain, artifact digest and deployed version
        status: unknown
        evidence:
          - The image carries the source revision as an OCI label and as the OpenTelemetry service.version; CI builds it from pinned base-image digests and records the image ID, an SPDX SBOM, and the stylesheet toolchain (Node version, npm lock-file hash, site.css hash) per run.
          - On main, after every gate passes, the publish job pushes the image that passed the container smoke test (handed over with docker save, no rebuild) to GHCR as sha-<revision> and main, and writes the registry digest, source revision and SBOM artifact link to the run summary.
          - A main run superseded while still queued is cancelled by the concurrency group, so a revision merged in quick succession may get no sha-<revision> image; the next revision's image includes its changes.
          - The SBOM is a run artifact, not attached to the registry digest; see DEV-014.
          - The deploy-dev job (ADR 0013) passes the digest that publish pushed to `pulumi up` as SITE_IMAGE, so dev runs exactly the image that passed the gates, and the dev stack's update history in Pulumi Cloud records each deployed image. The status stays unknown until a release to an environment other than dev exists.
  ES-050:
