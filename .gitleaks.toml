# Secret scanning rules (ES-024). Extends the gitleaks defaults; every allowlist entry is narrow and explained.
title = "umbraco-sample"

[extend]
useDefault = true

[[allowlists]]
description = "uSync item identifiers: Key=\"<guid>\" attributes in schema files are public identifiers, not secrets"
condition = "AND"
paths = ['''(^|/)uSync/v\d+/.*\.config$''']
regexTarget = "line"
regexes = ['''Key="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"''']

[[allowlists]]
description = "uSync item identifiers in JSON values (block keys, element type keys): a secret that is exactly a GUID in a uSync config file is an identifier"
condition = "AND"
paths = ['''(^|/)uSync/v\d+/.*\.config$''']
regexTarget = "secret"
regexes = ['''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$''']
