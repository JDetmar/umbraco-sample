name: dev-check

# Daily check of the dev environment (ENV-01, OPS-03):
# 1. Drift: refresh from Azure in memory and fail if anything differs from the code on main, so a change made outside
#    Pulumi is caught. Preview never saves a refresh, so the stack is not changed.
# 2. Smoke: run the post-deployment smoke test against dev, so a broken environment is noticed even with no deploy.
# It uses the dev environment's deploy identity (ADR 0013, accepted with conditions as DEV-017) read-only: it runs
# only `output` and `preview`, never `up`, and only code on main. It runs only once the owner sets DEV_CHECK_ENABLED,
# which is the owner's approval of this extra use. GitHub notifies a scheduled run's failure to the user who last
# changed the schedule, so the owner should be the one who enables it (docs/infra-setup.md).
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CI: "true"

jobs:
  check:
    name: dev (drift and smoke)
    if: vars.CD_DEV_ENABLED == 'true' && vars.DEV_CHECK_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    # Not the pulumi-dev group: GitHub keeps one waiting job per group and cancels the older one, so a scheduled check
    # queued behind a deploy could cancel the next deploy. A check that overlaps a deploy may report changes; re-run it.
    concurrency:
      group: dev-check
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC to Azure and Pulumi Cloud; no stored credential (ES-024)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: ${{ vars.PULUMI_ORG }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ vars.PULUMI_ORG }}
      # The site address comes from the stack's outputs, read before the drift check, which fails on drift.
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        id: stack
        with:
          command: output
          stack-name: ${{ vars.PULUMI_ORG }}/umbraco-sample/dev
          work-dir: infra/UmbracoSample.Infra
          pulumi-version: 3.275.0
      # Compare against the image dev runs (the stack's siteImage output), so a pending or failed deploy is not drift.
      - name: Check the deployed image is known
        env:
          SITE_IMAGE: ${{ steps.stack.outputs.siteImage }}
        run: |
          set -euo pipefail
          if [[ ! "${SITE_IMAGE}" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The dev stack has no siteImage output pinned by digest; deploy dev from main once to set it."
            exit 1
          fi
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        id: drift
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_ORG }}/umbraco-sample/dev
          work-dir: infra/UmbracoSample.Infra
          refresh: true
          expect-no-changes: true
          # No property diff: Actions logs are public, and a diff prints systemData (ADR 0014). The failure names the
          # changed resources; the details are in Pulumi Cloud or `make infra-preview STACK=dev`.
          diff: false
          pulumi-version: 3.275.0 # same pinned CLI as every other Pulumi job (ES-013)
        env:
          SITE_IMAGE: ${{ steps.stack.outputs.siteImage }}
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Runs even when drift is found, so one run reports both.
      - name: Smoke test dev
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        env:
          SITE_URL: ${{ steps.stack.outputs.siteUrl }}
          SMOKE_RETRIES: "30"
        run: scripts/smoke.sh "${SITE_URL}"
