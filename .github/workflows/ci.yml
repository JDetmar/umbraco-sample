name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main revision keeps its own result (ES-011).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CI: "true"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  validate:
    name: validate (format, build, test, secrets, vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - run: make lockfiles-check
      - run: make format-check
      - run: make frontend
      - run: make frontend-test
      - run: make frontend-audit
      - run: make build
      - run: make test
      - run: make infra-test
      - run: make secrets
      - run: make vuln

  integration:
    name: integration (Aspire stack with SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make frontend
      - run: make restore
      - run: make build
      # Starts SQL Server and the site through the AppHost; content is the synthetic uSync seed (ES-027).
      - run: make test-integration

  image:
    name: image (build, SBOM, container smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pinned by digest (ES-013); the AppHost pins the same digest for local runs and the integration job.
      SQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make frontend

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/UmbracoSample.Web/Dockerfile
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: umbraco-sample:ci
          load: true
          push: false

      - name: Generate SBOM (ES-016)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: umbraco-sample:ci
          format: spdx-json
          artifact-name: sbom-umbraco-sample.spdx.json

      - name: Run the image against SQL Server
        run: |
          # Throwaway credentials for this job only; generated per run, never stored (ES-024).
          sa_password="Sa1-$(openssl rand -hex 16)"
          admin_password="Ad1-$(openssl rand -hex 16)"
          echo "::add-mask::${sa_password}"
          echo "::add-mask::${admin_password}"
          docker network create smoke
          docker run -d --name sql --network smoke -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=${sa_password}" "${SQL_IMAGE}"
          db_ready=false
          for _ in $(seq 1 30); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "${sa_password}" -Q "IF DB_ID('umbraco') IS NULL CREATE DATABASE umbraco" >/dev/null 2>&1; then
              db_ready=true
              break
            fi
            sleep 5
          done
          if [ "${db_ready}" != true ]; then
            echo "SQL Server did not accept connections within 150 seconds." >&2
            docker logs sql 2>&1 | tail -n 50
            exit 1
          fi
          docker run -d --name web --network smoke -p 8080:8080 \
            -e "ConnectionStrings__umbracoDbDSN=Server=sql;Database=umbraco;User Id=sa;Password=${sa_password};TrustServerCertificate=true" \
            -e ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.SqlClient \
            -e Umbraco__CMS__Unattended__InstallUnattended=true \
            -e "Umbraco__CMS__Unattended__UnattendedUserName=Smoke Admin" \
            -e Umbraco__CMS__Unattended__UnattendedUserEmail=admin@example.com \
            -e "Umbraco__CMS__Unattended__UnattendedUserPassword=${admin_password}" \
            -e "Umbraco__CMS__Imaging__HMACSecretKey=$(openssl rand -hex 64)" \
            -e Umbraco__CMS__WebRouting__UmbracoApplicationUrl=http://localhost:8080/ \
            -e uSync__Settings__FirstBootGroup=All \
            umbraco-sample:ci

      - name: Smoke test (ES-030)
        env:
          SMOKE_RETRIES: "30"
          SMOKE_HOME_MARKER: "<h1>Umbraco sample</h1>"
        run: scripts/smoke.sh http://localhost:8080

      - name: Container logs
        if: always()
        run: docker logs web 2>&1 | tail -n 200 || true

      - name: Record image inventory (ES-049)
        run: |
          {
            echo "Image ID: $(docker image inspect umbraco-sample:ci --format '{{.Id}}')"
            echo "Source revision: ${GITHUB_SHA}"
            echo "Stylesheet toolchain: Node $(node --version), frontend/package-lock.json sha256 $(sha256sum frontend/package-lock.json | cut -d' ' -f1)"
            echo "site.css sha256: $(sha256sum src/UmbracoSample.Web/wwwroot/dist/site.css | cut -d' ' -f1)"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Main only: hand the exact image that passed the smoke test to the publish job, which holds the only
      # registry write token. No rebuild, so the published digest names what was tested (ES-049, ES-017).
      - name: Save the tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save umbraco-sample:ci | gzip > "${RUNNER_TEMP}/umbraco-sample-image.tar.gz"

      - name: Upload the tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umbraco-sample-image
          path: ${{ runner.temp }}/umbraco-sample-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e (journeys, accessibility, visual regression)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make frontend
      - run: make restore
      - run: make build

      - name: Start the site (Aspire, SQL Server, synthetic seed content)
        run: |
          # Aspire 17 starts the AppHost through the Aspire CLI, which builds and runs the Debug configuration and ignores
          # -c Release --no-build (ADR 0012), so the AppHost is started the same way as `make run`.
          # Throwaway admin password for this job only (ES-024). The name has a hyphen, so it is passed with env,
          # because bash cannot export it.
          admin_password="Ad1-$(openssl rand -hex 16)"
          echo "::add-mask::${admin_password}"
          ASPIRE_ALLOW_UNSECURED_TRANSPORT=true env "Parameters__umbraco-admin-password=${admin_password}" \
            nohup dotnet run --project src/UmbracoSample.AppHost --launch-profile http > apphost.log 2>&1 &
          # Ready means the runtime is up; the seeded fixture page answering means the uSync import has finished too.
          for _ in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:43835/health/ready > /dev/null \
              && curl -sf --max-time 10 http://localhost:43835/fixture-maximal/ > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "The site and its seed content were not ready within 5 minutes." >&2
          tail -n 100 apphost.log
          exit 1

      - name: Playwright in the pinned image
        run: make e2e

      - name: Lighthouse budgets in the pinned image
        run: make lighthouse

      - name: Show the site log on failure
        if: failure()
        run: tail -n 200 apphost.log || true

  publish:
    name: publish (main only, image to GHCR by digest)
    # Only after every gate passed on this revision. No checkout and no third-party build code run here,
    # so the registry write token is never exposed to them (ES-017).
    needs: [validate, integration, image, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: umbraco-sample-image
          path: ${{ runner.temp }}

      - name: Push to GHCR and record the digest
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          gunzip -c "${RUNNER_TEMP}/umbraco-sample-image.tar.gz" | docker load
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag umbraco-sample:ci "${repository}:sha-${GITHUB_SHA}"
          docker tag umbraco-sample:ci "${repository}:main"
          docker push "${repository}:sha-${GITHUB_SHA}"
          docker push "${repository}:main"
          digest="$(docker buildx imagetools inspect "${repository}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Pushed, but could not read the registry digest (got '${digest}')." >&2
            exit 1
          fi
          {
            echo "### Published image"
            echo
            echo "- Image: \`${repository}@${digest}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo "- SBOM: artifact \`sbom-umbraco-sample.spdx.json\` of ${RUN_URL} (run artifacts expire; see ledger ES-049)"
            echo
            echo "CD deploys it to dev; pin it for prod with \`pulumi config set image ${repository}@${digest} --stack prod\`."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "image=${repository}@${digest}" >> "${GITHUB_OUTPUT}"

  deploy-dev:
    name: deploy (dev, pulumi up)
    # CD for dev (ADR 0013): every main revision that passed all gates and published goes to dev, by digest.
    # Off until the owner has amended the CLAUDE.md delegation envelope, done the CD setup in docs/infra-setup.md
    # and set CD_DEV_ENABLED=true. This job only targets dev; its credentials alone do not keep it there (R4).
    needs: publish
    if: vars.CD_DEV_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    # One Pulumi operation on the dev stack at a time, shared with the infra preview; never cancelled midway.
    concurrency:
      group: pulumi-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC to Azure and Pulumi Cloud; no stored deploy secret (ES-024)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs for consecutive commits overlap, so an older run can reach this job after a newer one has deployed.
      # Only the run for the current head of main deploys; an older one would roll dev back.
      - name: Check this run is still the head of main
        id: current
        run: |
          set -euo pipefail
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${head}" == "${GITHUB_SHA}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::main is now at ${head}; its own run deploys it, so this run skips the deploy."
          fi
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          global-json-file: global.json
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        if: steps.current.outputs.deploy == 'true'
        with:
          organization: ${{ vars.PULUMI_ORG }}
          # Organization and team tokens need a paid Pulumi organization plan; on an individual account the
          # organization is the user, so the exchange asks for that user's personal token (docs/infra-setup.md).
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ vars.PULUMI_ORG }}
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        if: steps.current.outputs.deploy == 'true'
        id: up
        with:
          command: up
          stack-name: ${{ vars.PULUMI_ORG }}/umbraco-sample/dev
          work-dir: infra/UmbracoSample.Infra
          # No property diff: this repository's Actions logs are public, and a diff prints resource metadata such as
          # systemData.createdBy (the sign-in name of whoever created or last changed the resource). The summary of
          # operations is still logged, and the full diff stays in Pulumi Cloud's private update history (ADR 0014).
          diff: false
          pulumi-version: 3.275.0 # same pinned CLI as the preview (ES-013)
        env:
          SITE_IMAGE: ${{ needs.publish.outputs.image }}
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The post-deployment check (ES-030): a cold start may wait for the serverless database to resume.
      - name: Smoke test dev
        if: steps.current.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.up.outputs.siteUrl }}
          SMOKE_RETRIES: "30"
        run: scripts/smoke.sh "${SITE_URL}"
